services:
  linkomat:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkomat:latest
    container_name: linkomat
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env

  caddy:
    image: caddy:2
    container_name: linkomat-caddy
    restart: unless-stopped
    ports:
      - "4443:443"
    environment:
      - LAN_IP=${LAN_IP:?LAN_IP must be set in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/cert.pem:/etc/caddy/cert.pem:ro
      - ./caddy/key.pem:/etc/caddy/key.pem:ro
    depends_on:
      - linkomat

volumes: {}
