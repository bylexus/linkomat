apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkomat-https
  namespace: linkomat
  labels:
    app: linkomat
spec:
  hostnames:
    - linkomat.alexi.ch
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kube002-gateway
      namespace: envoy-gateway-system
      sectionName: linkomat-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: linkomat-service
          port: 80
          weight: 1
