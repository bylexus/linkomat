apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkomat-http-redirect
  namespace: linkomat
  labels:
    app: linkomat
spec:
  hostnames:
    - linkomat.alexi.ch
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kube002-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
