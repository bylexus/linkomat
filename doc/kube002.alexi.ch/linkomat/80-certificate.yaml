apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkomat-tls
  namespace: envoy-gateway-system
  labels:
    app: linkomat
spec:
  secretName: linkomat-tls
  dnsNames:
    - linkomat.alexi.ch
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lets-encrypt-alexi-ch
